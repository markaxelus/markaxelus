name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight
  workflow_dispatch:     # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Grants necessary access permissions to fix exit code 128
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 1: Generates the custom fire streak card
      - name: Generate Streak Stats Card
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GH_TOKEN }}
          output-path: "./generated-stats/github-readme-streak.svg"
          theme: tokyonight  # Uses dark background with cyan text matching your screenshot
          hide-border: false

      # STEP 2: Saves the local file into your repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ./generated-stats
          git add ./generated-stats/github-readme-streak.svg
          git commit -m "Update GitHub Readme Streak Card" || exit 0
          git push
